<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1240" font-family="Inter, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .p{font-size:11px;font-style:italic;fill:#64748b}
      .l{font-size:11px;fill:#475569}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dl{stroke:#475569;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .llm{fill:#e0e7ff;stroke:#4338ca;stroke-width:1.5}
      .code{fill:#ccfbf1;stroke:#0f766e;stroke-width:1.5}
      .guard{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}
      .stop{fill:#fee2e2;stroke:#dc2626;stroke-width:1.5}
      .ok{fill:#dcfce7;stroke:#16a34a;stroke-width:1.5}
    </style>
  </defs>
  <rect width="960" height="1240" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#1e1b4b">Research &amp; Decision Intelligence Agent: Pipeline</text>
  <text x="480" y="60" text-anchor="middle" class="s">The LLM decides what to do. Python decides what is allowed.</text>

  <!-- user -->
  <rect x="380" y="80" width="200" height="40" rx="20" fill="#1e1b4b"/>
  <text x="480" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">User decision question</text>
  <path class="ln" d="M480 120 V146"/>

  <!-- input guardrails -->
  <rect class="guard" x="310" y="148" width="340" height="62" rx="10"/>
  <text x="480" y="172" text-anchor="middle" class="t">Input guardrails</text>
  <text x="480" y="192" text-anchor="middle" class="s">regex: injection · secrets · size  +  LLM scope check</text>
  <path class="ln" d="M650 179 H748"/>
  <text x="698" y="171" text-anchor="middle" class="l">blocked</text>
  <rect class="stop" x="750" y="156" width="160" height="46" rx="10"/>
  <text x="830" y="184" text-anchor="middle" class="t">⛔ Blocked</text>
  <path class="ln" d="M480 210 V236"/>

  <!-- planner -->
  <rect class="llm" x="310" y="238" width="340" height="66" rx="10"/>
  <text x="480" y="262" text-anchor="middle" class="t">① Research Planner (LLM)</text>
  <text x="480" y="280" text-anchor="middle" class="s">→ ResearchPlan: sub-questions, impact level</text>
  <text x="480" y="296" text-anchor="middle" class="p">prompt chaining</text>
  <path class="ln" d="M480 304 V330"/>

  <!-- router -->
  <rect class="code" x="310" y="332" width="340" height="66" rx="10"/>
  <text x="480" y="356" text-anchor="middle" class="t">② Router (Python)</text>
  <text x="480" y="374" text-anchor="middle" class="s">decide_path() · route_subquestions() · adds SQ-RISK</text>
  <text x="480" y="390" text-anchor="middle" class="p">routing</text>

  <!-- quick path -->
  
  <text x="100" y="580" class="l" transform="rotate(-90 100 580)">quick path (1 low-impact sub-question)</text>
  <text x="250" y="357" text-anchor="middle" class="l">quick</text>

  <path class="ln" d="M480 398 V426"/>
  <text x="492" y="418" class="l">full</text>

  <!-- parallel -->
  <rect x="170" y="428" width="620" height="126" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="480" y="450" text-anchor="middle" class="t">③ Parallel research</text>
  <text x="480" y="466" text-anchor="middle" class="p">parallelization · asyncio.gather + semaphore</text>
  <rect class="llm" x="200" y="478" width="170" height="60" rx="10"/>
  <text x="285" y="504" text-anchor="middle" class="t">Technical</text>
  <text x="285" y="522" text-anchor="middle" class="s">specialist</text>
  <rect class="llm" x="395" y="478" width="170" height="60" rx="10"/>
  <text x="480" y="504" text-anchor="middle" class="t">Market</text>
  <text x="480" y="522" text-anchor="middle" class="s">specialist</text>
  <rect class="llm" x="590" y="478" width="170" height="60" rx="10"/>
  <text x="675" y="504" text-anchor="middle" class="t">Risk</text>
  <text x="675" y="522" text-anchor="middle" class="s">specialist</text>
  <text x="810" y="482" class="l">tools per specialist:</text>
  <text x="810" y="498" class="l">search_web →</text>
  <text x="810" y="514" class="l">scrape_page →</text>
  <text x="810" y="530" class="l">extract_claims →</text>
  <text x="810" y="546" class="l">save_evidence (verbatim)</text>
  <path class="ln" d="M480 554 V580"/>

  <!-- orchestrator -->
  <rect class="llm" x="310" y="582" width="340" height="66" rx="10"/>
  <text x="480" y="606" text-anchor="middle" class="t">④ Research Orchestrator (LLM)</text>
  <text x="480" y="624" text-anchor="middle" class="s">fills gaps / resolves conflicts via delegate_* (max 3)</text>
  <text x="480" y="640" text-anchor="middle" class="p">orchestrator-workers</text>
  <path class="ln" d="M480 648 V690"/>

  <!-- evaluator loop -->
  <rect x="170" y="692" width="620" height="216" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="480" y="714" text-anchor="middle" class="t">⑤ Evaluator-optimizer loop</text>
  <text x="480" y="730" text-anchor="middle" class="p">max 3 rounds (2 on quick path) · stop on no progress · best draft kept</text>
  <rect class="llm" x="310" y="772" width="160" height="56" rx="10"/>
  <text x="390" y="796" text-anchor="middle" class="t">Report Writer</text>
  <text x="390" y="814" text-anchor="middle" class="s">→ DecisionReport</text>
  <rect class="guard" x="510" y="744" width="250" height="50" rx="10"/>
  <text x="635" y="766" text-anchor="middle" class="t">Output guardrail</text>
  <text x="635" y="783" text-anchor="middle" class="s">unknown evidence ids · injected text</text>
  <rect class="code" x="510" y="806" width="250" height="40" rx="10"/>
  <text x="635" y="831" text-anchor="middle" class="s"><tspan font-weight="700">Validator</tspan> · unsupported numbers</text>
  <rect class="llm" x="510" y="856" width="250" height="42" rx="10"/>
  <text x="635" y="882" text-anchor="middle" class="s"><tspan font-weight="700">Critic (LLM)</tspan> → score + issues</text>
  <path class="ln" d="M470 790 H508"/>
  <path class="ln" d="M635 794 V804"/>
  <path class="ln" d="M635 846 V854"/>
  <path class="dl" d="M510 877 H390 V830"/>
  <text x="440" y="871" text-anchor="middle" class="l">revise</text>
  <path class="ln" d="M635 898 V942"/>
  <text x="647" y="928" class="l">approve / max rounds</text>

  <path class="dl" d="M310 365 H90 V800 H308"/>

  <!-- HITL gate -->
  <polygon class="code" points="635,944 840,1000 635,1056 430,1000"/>
  <text x="635" y="994" text-anchor="middle" class="t">⑥ HITL gate</text>
  <text x="635" y="1012" text-anchor="middle" class="s">high impact? sensitive?</text>
  <text x="635" y="1027" text-anchor="middle" class="s">open issues? low confidence?</text>

  <path class="ln" d="M840 1000 H880 V1078"/>
  <text x="852" y="992" class="l">no</text>
  <path class="ln" d="M430 1000 H300 V1078"/>
  <text x="400" y="992" class="l">yes</text>

  <rect class="code" x="200" y="1080" width="200" height="50" rx="10"/>
  <text x="300" y="1102" text-anchor="middle" class="t">Approval queue</text>
  <text x="300" y="1120" text-anchor="middle" class="s">SQLite · Approvals tab</text>
  <path class="ln" d="M400 1105 H478"/>
  <polygon class="code" points="540,1080 600,1105 540,1130 480,1105"/>
  <text x="540" y="1109" text-anchor="middle" class="s" font-weight="700">Human</text>
  <path class="ln" d="M600 1105 H760"/>
  <text x="680" y="1097" text-anchor="middle" class="l">approve</text>
  <path class="ln" d="M540 1130 V1170"/>
  <text x="552" y="1155" class="l">reject</text>
  <rect class="stop" x="470" y="1172" width="140" height="40" rx="10"/>
  <text x="540" y="1197" text-anchor="middle" class="t">✕ Not published</text>

  <rect class="ok" x="762" y="1080" width="172" height="50" rx="10"/>
  <text x="848" y="1102" text-anchor="middle" class="t">✅ publish_report</text>
  <text x="848" y="1120" text-anchor="middle" class="s">outputs/&lt;run_id&gt;.md</text>

  <!-- legend -->
  <g transform="translate(40,1170)">
    <rect class="llm" width="16" height="12" rx="3"/><text x="22" y="11" class="l">LLM agent</text>
    <rect class="code" y="18" width="16" height="12" rx="3"/><text x="22" y="29" class="l">Python (deterministic)</text>
    <rect class="guard" y="36" width="16" height="12" rx="3"/><text x="22" y="47" class="l">Guardrail</text>
  </g>
</svg>
